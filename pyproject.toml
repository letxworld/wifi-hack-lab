[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-hack-lab"
version = "0.1.0"
description = "Educational WiFi security tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT with Ethical Use Clause"}
dependencies = [
    "click>=8.0.0",
    "scapy>=2.4.5",
    "rich>=13.0.0"
]

[project.scripts]
wifi-hack-lab = "wifi_hack_lab.cli:main"

[tool.setuptools.packages.find]
include = ["wifi_hack_lab*"]