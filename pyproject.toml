[build-system]
requires = ["maturin>=0.14,<0.15"]
build-backend = "maturin"

[project]
name = "wifi-hack-lab"
version = "0.1.0"
description = "Educational WiFi security tool — capture and crack WPA2 handshakes on your own network"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
license = { text = "MIT with Ethical Use Clause" }
repository = "https://github.com/letxworld/wifi-hack-lab"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Education",
    "Environment :: Console"
]
dependencies = [
    "click>=8.0.0",
    "scapy>=2.4.5",
    "rich>=13.0.0"
]

[project.scripts]
wifi-hack-lab = "wifi_hack_lab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "maturin>=0.14.0"
]

[tool.maturin]
python-source = "."
module-name = "wifi_hack_lab._core"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=wifi_hack_lab"
testpaths = ["tests"]